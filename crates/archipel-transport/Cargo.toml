[package]
name = "archipel-transport"
description = "Local socket / named pipe, WebSocket and stdio transports; auth and scopes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
# Only named to switch its `vendored` feature on, see below.
native-tls = { version = "0.2.18", optional = true }

[features]
# Builds OpenSSL into the program instead of using the system's, for a Linux program that has
# to run on machines whose libraries are not known (a static musl build). Off by default.
vendored-tls = ["dep:native-tls", "native-tls/vendored"]

[lints]
workspace = true
