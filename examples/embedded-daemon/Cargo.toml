[package]
name = "embedded-daemon"
description = "Example: a Rust program that hosts the daemon in its own process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bridge-agents = { path = "../../crates/bridge-agents" }
bridge-core = { path = "../../crates/bridge-core" }
bridge-server = { path = "../../crates/bridge-server" }
bridge-transport = { path = "../../crates/bridge-transport" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }

[lints]
workspace = true
