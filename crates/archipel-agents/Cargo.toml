[package]
name = "archipel-agents"
description = "Adapter supervisor, ACP client connection, and the profiles for Claude and Pi."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
archipel-core = { path = "../archipel-core" }
archipel-transport = { version = "0.1.0", path = "../archipel-transport" }
getrandom = "0.4.3"
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "io-std", "sync", "time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
