[package]
name = "bridge-server"
description = "Assembles the other crates behind a builder. The library entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bridge-addon-api = { path = "../bridge-addon-api" }
bridge-core = { path = "../bridge-core" }
bridge-store-sqlite = { path = "../bridge-store-sqlite" }
bridge-agents = { path = "../bridge-agents" }
bridge-transport = { path = "../bridge-transport" }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
serde_json = "1.0.154"
indexmap = "2.14.2"
bridge-schema = { version = "0.0.0", path = "../bridge-schema" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
