[package]
name = "bridged"
description = "The daemon binary: config, CLI, pairing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bridge-agents = { path = "../bridge-agents" }
bridge-core = { path = "../bridge-core" }
bridge-server = { path = "../bridge-server" }
bridge-transport = { path = "../bridge-transport" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[lints]
workspace = true
