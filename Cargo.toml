[workspace]
resolver = "3"
members = ["crates/*", "examples/embedded-daemon", "examples/own-daemon"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
