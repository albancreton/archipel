[package]
name = "bridge-client"
description = "A client for the daemon: the connection, and the `bridge` command-line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "bridge-demo-checkpoints"
path = "src/bin/demo_checkpoints.rs"

[dependencies]
base64 = "0.23.1"
bridge-core = { path = "../bridge-core" }
bridge-schema = { path = "../bridge-schema" }
bridge-transport = { path = "../bridge-transport" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "io-util", "io-std", "process"] }

[dev-dependencies]
bridge-agents = { path = "../bridge-agents" }
bridge-server = { path = "../bridge-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process"] }

[lints]
workspace = true
