[package]
name = "archipel-server"
description = "Assembles the other crates behind a builder. The library entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
archipel-addon-api = { path = "../archipel-addon-api" }
archipel-core = { path = "../archipel-core" }
archipel-store-sqlite = { path = "../archipel-store-sqlite" }
archipel-agents = { path = "../archipel-agents" }
archipel-transport = { path = "../archipel-transport" }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
serde_json = "1.0.154"
indexmap = "2.14.2"
archipel-schema = { version = "0.2.0", path = "../archipel-schema" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
