[package]
name = "archipel-transport"
description = "Local socket / named pipe, WebSocket and stdio transports; auth and scopes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[lints]
workspace = true
