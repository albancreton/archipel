[package]
name = "bridge-agents"
description = "Adapter supervisor, ACP client connection, and the profiles for Claude and Pi."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bridge-core = { path = "../bridge-core" }
bridge-transport = { version = "0.0.0", path = "../bridge-transport" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "io-std", "sync", "time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
