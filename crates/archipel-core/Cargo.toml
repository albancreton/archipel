[package]
name = "archipel-core"
description = "Items, reducer, session state, sequencing, and the normaliser and store traits. No IO."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
archipel-schema = { path = "../archipel-schema" }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true

[dev-dependencies]
indexmap = "2.14.2"
