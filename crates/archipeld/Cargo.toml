[package]
name = "archipeld"
description = "The daemon binary: config, CLI, pairing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
archipel-addons = { path = "../archipel-addons" }
archipel-agents = { path = "../archipel-agents" }
archipel-core = { path = "../archipel-core" }
archipel-server = { path = "../archipel-server" }
archipel-transport = { path = "../archipel-transport" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
