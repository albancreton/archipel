[package]
name = "own-daemon"
description = "Example: a daemon with an addon of one's own, without forking the library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# An addon needs only this.
archipel-addon-api = { path = "../../crates/archipel-addon-api" }
serde_json = "1.0.154"
# The program around it.
archipel-addons = { path = "../../crates/archipel-addons" }
archipeld = { path = "../../crates/archipeld" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
