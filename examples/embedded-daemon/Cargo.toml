[package]
name = "embedded-daemon"
description = "Example: a Rust program that hosts the daemon in its own process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
archipel-agents = { path = "../../crates/archipel-agents" }
archipel-core = { path = "../../crates/archipel-core" }
archipel-server = { path = "../../crates/archipel-server" }
archipel-transport = { path = "../../crates/archipel-transport" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }

[lints]
workspace = true
